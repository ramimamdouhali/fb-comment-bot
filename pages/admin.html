<!DOCTYPE html>
<html>
<head>
    <title>Edit Prices - Page {{PAGE_ID}}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        textarea {
            width: 100%;
            height: 400px;
            padding: 15px;
            font-size: 14px;
            font-family: monospace;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
        }

        button {
            background: #1877f2;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1669d9;
        }

        .info {
            margin-top: 20px;
            color: #666;
            line-height: 1.6;
        }

        code {
            background: #eee;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Edit Prices for Page {{PAGE_ID}}</h2>

    <form method="POST" action="/admin/{{PAGE_ID}}">
        <textarea name="prices">{{PRICES}}</textarea>

        <br><br>

        <button type="submit">Save Prices</button>
    </form>

    <div class="info">
        <p><strong>Format:</strong></p>

        <code>
        {
            "item_code": price
        }
        </code>

        <p>
            Use:
            <code>Code: item_code</code>
            in your Facebook post.
        </p>
    </div>

</div>

</body>
</html>
