<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Manage Products</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th, td {
            border-bottom: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #f0f2f5;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-right: 10px;
        }

        button {
            background: #1877f2;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1669d9;
        }

        .delete-btn {
            background: #e53935;
        }

        .delete-btn:hover {
            background: #c62828;
        }

        .add-form {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .price {
            font-weight: bold;
            color: #1877f2;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>📦 Product Manager</h1>

    <table>

        <thead>

            <tr>
                <th>Product Code</th>
                <th>Price</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody>

            {{ROWS}}

        </tbody>

    </table>

    <div class="add-form">

        <h2>Add Product</h2>

        <form
            method="POST"
            action="/admin/{{PAGE_ID}}/add"
        >

            <input
                type="text"
                name="code"
                placeholder="Product Code"
                required
            >

            <input
                type="number"
                step="0.01"
                name="price"
                placeholder="Price"
                required
            >

            <button type="submit">
                Add Product
            </button>

        </form>

    </div>

</div>

</body>
</html>
