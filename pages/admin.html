<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Manage Products</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th, td {
            border-bottom: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #f0f2f5;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-right: 10px;
        }

        button {
            background: #1877f2;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1669d9;
        }

        .delete-btn {
            background: #e53935;
        }

        .delete-btn:hover {
            background: #c62828;
        }
        .edit-btn {
            background: #1976d2;
            color: white;
        }

        .add-form {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .price {
            font-weight: bold;
            color: #1877f2;
        }

        .search-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }



        .flash {
            padding: 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .flash.success {
            background: #d4edda;
            color: #155724;
        }
        
        .flash.error {
            background: #f8d7da;
            color: #721c24;
        }        

    </style>

</head>

<body>

<div class="container">

    <h1>📦 Product Manager</h1>
    {{FLASH_MESSAGE}}
    <input
        type="text"
        id="searchInput"
        <select
            id="sortSelect"
            class="search-input"
        >
            <option value="az">
                Sort A → Z
            </option>
        
            <option value="za">
                Sort Z → A
            </option>
        </select>        
        placeholder="🔍 Search products..."
        class="search-input"
    >

    <table>

        <thead>

            <tr>
                <th>Product Code</th>
                <th>Price</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="productsBody">

            {{ROWS}}

        </tbody>

    </table>

    <div class="add-form">

        <h2>Add Product</h2>

        <form
            method="POST"
            action="/admin/{{PAGE_ID}}/add"
        >

            <input
                type="text"
                name="code"
                placeholder="Product Code"
                required
            >

            <input
                type="number"
                step="0.01"
                name="price"
                placeholder="Price"
                required
            >

            <button type="submit">
                Add Product
            </button>

        </form>

    </div>

</div>

    <script>
    const searchInput =
        document.getElementById(
            'searchInput'
        );    
    searchInput.addEventListener(
        'input',
        function () {    
            const search =
                this.value.toLowerCase();    
            const rows =
                document.querySelectorAll(
                    'tbody tr'
                );    
            rows.forEach(row => {    
                const code =
                    row.dataset.code || '';    
                if (
                    code.includes(search)
                ) {    
                    row.style.display = '';    
                } else {    
                    row.style.display =
                        'none';
                }    
            });    
        }
    );
        const sortSelect =
            document.getElementById(
                'sortSelect'
            );        
        sortSelect.addEventListener(
            'change',
            function () {        
                const tbody =
                    document.getElementById(
                        'productsBody'
                    );        
                const rows =
                    Array.from(
                        tbody.querySelectorAll('tr')
                    );        
                rows.sort((a, b) => {        
                    const codeA =
                        a.dataset.code;        
                    const codeB =
                        b.dataset.code;        
                    if (this.value === 'az') {        
                        return codeA.localeCompare(codeB);        
                    } else {        
                        return codeB.localeCompare(codeA);
                    }        
                });        
                rows.forEach(row => {
                    tbody.appendChild(row);
                });        
            }
        );        
    </script>
</body>
</html>
